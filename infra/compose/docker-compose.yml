services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: easyconstruct
      POSTGRES_USER: easyconstruct
      POSTGRES_PASSWORD: easyconstruct-local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyconstruct -d easyconstruct"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easyconstruct
      MINIO_ROOT_PASSWORD: easyconstruct-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_data:/data

volumes:
  postgres_data:
  object_data:
