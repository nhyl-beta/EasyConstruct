services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: easyconstruct
      POSTGRES_USER: easyconstruct
      POSTGRES_PASSWORD: easyconstruct-local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyconstruct -d easyconstruct"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easyconstruct
      MINIO_ROOT_PASSWORD: easyconstruct-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_data:/data

  # Local S3 testing: `docker compose --profile s3 up minio-init` creates the bucket, then run the API with
  # S3_ENDPOINT=http://localhost:9000, S3_BUCKET=easyconstruct-files and the local-only MinIO credentials above
  # (S3_ACCESS_KEY_ID=easyconstruct, S3_SECRET_ACCESS_KEY=easyconstruct-local).
  minio-init:
    profiles: ["s3"]
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 easyconstruct easyconstruct-local; do sleep 1; done;
      mc mb --ignore-existing local/easyconstruct-files"

volumes:
  postgres_data:
  object_data:
