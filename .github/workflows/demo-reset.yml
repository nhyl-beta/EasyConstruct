name: Reset and reseed demo data

# Manual only. Runs the same steps as the PowerShell guide (merge-repoint-and-reset-data-steps.md, Part 2) on a
# GitHub runner, because the runner can reach Neon and a laptop shell may not.
#   dry_run (default on): lists pending migrations and the row counts demo:reset would delete. Changes nothing.
#   real run: needs confirm = "reset neon demo data". Migrates, demo:reset (backup + one transaction; accounts,
#   roles and templates are never touched), seeds the price catalog, starts a throwaway API on the runner
#   (port 8123, no real file storage), runs demo:seed and demo:verify.
# The seed goes through the API from a US runner to Neon in Singapore, so it is slow (about 45 to 60 minutes).
# Make a Neon branch (before-reset-YYYYMMDD) first. Secret used (name only): DATABASE_URL.
# The throwaway API uploads to the Filebase bucket (same bucket and keys the backup workflow uses), so seeded files
# exist for real. With clear_files on, everything under easyconstruct/ is deleted first; db/ is never touched.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: change nothing, only print what would happen"
        type: boolean
        default: true
      confirm:
        description: 'Real run only: type exactly "reset neon demo data"'
        type: string
        default: ""
      clear_files:
        description: "Real run only: also delete the app files under easyconstruct/ in the Filebase bucket (db/ backups are never touched)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRM: ${{ inputs.confirm }}
      SECRET_URL: ${{ secrets.DATABASE_URL }}
      ALLOW_DEMO_RESET: "true"
      DISABLE_SCHEDULER: "true"
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.BACKUP_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - name: Check inputs
        run: |
          if [ -z "$SECRET_URL" ]; then echo "::error::Add the DATABASE_URL repository secret"; exit 1; fi
          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM" != "reset neon demo data" ]; then
            echo '::error::Real run needs confirm = "reset neon demo data"'; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point the scripts at the direct Neon host
        run: |
          # the reset scripts want the direct host, not the -pooler one (same credentials)
          url="${SECRET_URL/-pooler/}"
          host="$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$url")"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "DEMO_RESET_ALLOWED_HOSTS=$host" >> "$GITHUB_ENV"
      - name: Dry run (migrations pending, rows that would go)
        working-directory: apps/api
        run: |
          npm run db:migrate -- --dry-run
          npm run demo:reset -- --dry-run
      - name: Check Filebase access (read-only)
        run: |
          if aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix easyconstruct/ --max-keys 1 --endpoint-url "$S3_ENDPOINT" >/dev/null 2>/tmp/s3err; then
            echo "S3_OK=true" >> "$GITHUB_ENV"
            aws s3 ls "s3://$S3_BUCKET/easyconstruct/" --recursive --summarize --endpoint-url "$S3_ENDPOINT" | tail -2
          else
            echo "S3_OK=false" >> "$GITHUB_ENV"; cat /tmp/s3err
            echo "::warning::Filebase refused these keys: files will NOT be cleared and the seed uploads to the runner's disk. Fix the BACKUP_S3_* / BACKUP_BUCKET secrets."
          fi
      - name: Migrate
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/api
        run: npm run db:migrate
      - name: Reset (backup first, one transaction)
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/api
        run: npm run demo:reset
      - name: Delete app files in Filebase (easyconstruct/ only)
        if: ${{ inputs.dry_run != true && inputs.clear_files && env.S3_OK == 'true' }}
        run: aws s3 rm "s3://$S3_BUCKET/easyconstruct/" --recursive --only-show-errors --endpoint-url "$S3_ENDPOINT"
      - name: Seed price catalog
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/api
        run: npm run ai:seed-references
      - name: Seed demo data and verify
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/api
        env:
          PORT: "8123"
          DOTENV_CONFIG_PATH: .env.check
          SMOKE_BASE_URL: http://localhost:8123/api
          # blank when Filebase refused the keys, so the API falls back to disk instead of failing every upload
          S3_ENDPOINT: ${{ env.S3_OK == 'true' && secrets.S3_ENDPOINT || '' }}
          S3_BUCKET: ${{ env.S3_OK == 'true' && secrets.BACKUP_BUCKET || '' }}
          S3_ACCESS_KEY_ID: ${{ env.S3_OK == 'true' && secrets.BACKUP_S3_ACCESS_KEY_ID || '' }}
          S3_SECRET_ACCESS_KEY: ${{ env.S3_OK == 'true' && secrets.BACKUP_S3_SECRET_ACCESS_KEY || '' }}
        run: |
          cp .env.check.example .env.check
          npx tsx src/main.ts > /tmp/api.log 2>&1 &
          api=$!
          for i in $(seq 1 60); do curl -fsS http://localhost:8123/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:8123/api/health || { cat /tmp/api.log; exit 1; }
          status=0
          npm run demo:seed && npm run demo:verify || status=1
          kill $api || true
          [ $status -eq 0 ] || { tail -50 /tmp/api.log; exit 1; }
      - name: Keep the pre-reset backup for 7 days
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-reset-backup
          path: apps/api/backups/
          retention-days: 7
          if-no-files-found: ignore
