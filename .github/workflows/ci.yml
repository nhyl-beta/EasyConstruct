name: CI

on:
  push:
    branches:
      - thesis-final
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --workspace=@easyconstruct/web @rollup/rollup-linux-x64-gnu@4.62.2 lightningcss-linux-x64-gnu@1.32.0 @tailwindcss/oxide-linux-x64-gnu@4.3.1
      - run: npm run lint --workspace=@easyconstruct/api
      - run: npm run lint --workspace=@easyconstruct/web
      - run: npm test --workspace=@easyconstruct/api
      - run: npm test --workspace=@easyconstruct/web
      - run: npm run build:server
      - run: npm run build:client
      - run: npm run typecheck --workspace=@easyconstruct/web
      - name: Compare API type errors with baseline
        shell: bash
        run: |
          baseline="$(grep -oE 'API type errors: *[0-9]+' refactor-notes/baseline.md | grep -oE '[0-9]+$')"
          if [[ -z "$baseline" ]]; then
            echo "Could not read the API type-error baseline."
            exit 1
          fi
          set +e
          npm run typecheck --workspace=@easyconstruct/api > api-typecheck.log 2>&1
          status=$?
          set -e
          count="$(grep -cE 'error TS[0-9]+' api-typecheck.log || true)"
          echo "API TypeScript errors: $count (baseline: $baseline)"
          if [[ "$status" -ne 0 && "$count" -eq 0 ]]; then
            cat api-typecheck.log
            exit "$status"
          fi
          if [[ "$count" -gt "$baseline" ]]; then
            cat api-typecheck.log
            exit 1
          fi

  # Proves the build can actually run: a fresh database is built from the schema, the real-database tests run
  # on it, then the built server is started and scripts/ops/smoke.mjs signs in and loads the first pages.
  boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
      JWT_SECRET: ci-test-secret
      ALLOW_DEMO_RESET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build a fresh database from the schema
        run: npm run db:bootstrap --workspace=@easyconstruct/api -- --yes
      - name: Schema, sequences and indexes match the code
        run: npm run db:verify-schema --workspace=@easyconstruct/api
      - name: Seed the demo accounts (the database tests need an Owner and an Engineer)
        run: npm run db:seed --workspace=@easyconstruct/api
      - name: Real-database tests
        run: npm run test:db --workspace=@easyconstruct/api
      - run: npm run build:server
      - name: Start the built server and smoke test it
        working-directory: apps/api
        env:
          PORT: 8123
          DISABLE_SCHEDULER: "true"
          SMOKE_BASE_URL: http://127.0.0.1:8123/api
          SMOKE_EMAIL: admin@easyconstruct.demo
          SMOKE_PASSWORD: Demo@12345
        run: |
          node dist/src/main.js > server.log 2>&1 &
          node scripts/ops/smoke.mjs || { cat server.log; exit 1; }
