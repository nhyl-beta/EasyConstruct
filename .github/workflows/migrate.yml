name: Run database migrations

# Applies the SQL migrations in apps/api/drizzle that the Neon database has not recorded (same script as
# `npm run db:migrate`). It runs by itself on every merge to thesis-final (the same push that makes Render deploy),
# and by hand from the Actions tab, where "dry run" (on by default) only lists what is pending. Migrations are
# additive, so the old API keeps working while the new one builds. Render's free Docker service has no
# pre-deploy hook and the production image has no tsx, so this is where migrations run.
# Secret used (name only): DATABASE_URL (the Neon connection string).
on:
  push:
    branches:
      - thesis-final
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list pending migrations, change nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret, then re-run this workflow"; exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then npm run db:migrate --workspace=@easyconstruct/api -- --dry-run
          else npm run db:migrate --workspace=@easyconstruct/api; fi
